<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Netflix - Cadastro</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header>
        <h1>Netflix</h1>
    </header>
    <main class="container">
        <div class="card card-large">
            <h2>Crie sua conta</h2>
            <form class="form-grid" onsubmit="event.preventDefault(); enviarDados();">
                <div class="form-group"><input type="text" id="nome" placeholder="Nome *" required></div>
                <div class="form-group"><input type="text" id="sobrenome" placeholder="Sobrenome *" required></div>
                <div class="form-group"><input type="text" id="cpf" placeholder="CPF *" required></div>
                <div class="form-group"><input type="text" id="telefone" placeholder="Telefone *" required></div>
                <div class="form-group full-width"><input type="email" id="email" placeholder="Email *" required></div>
                <div class="form-group full-width"><input type="password" id="senha" placeholder="Senha *" required>
                </div>
                <div class="form-group"><input type="text" id="rua" placeholder="Rua *" required></div>
                <div class="form-group"><input type="text" id="cep" placeholder="CEP *" required></div>
                <div class="form-group"><input type="text" id="cidade" placeholder="Cidade *" required></div>
                <div class="form-group"><input type="text" id="estado" placeholder="Estado (UF) *" maxlength="2"
                        required></div>

                <form class="form-grid" onsubmit="event.preventDefault(); enviarDados();">
                    <!-- Os teus inputs aqui -->
                    <button type="submit" class="btn">Cadastrar</button>
                </form>
            </form>
            <a href="login.html" class="link">Já tem uma conta? Entrar.</a>
        </div>
    </main>
    <script src="/public/cadastro.js"></script>
</body>

</html>
